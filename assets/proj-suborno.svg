<text x="24" y="110" font-size="14" fill="#22d3ee">Bengali Programming Language Compiler</text>
<rect x="24" y="126" width="392" height="1" fill="#30363d"/>
<text x="24" y="152" font-size="13.5" fill="#c9d1d9">A Bengali-script language compiler with lexing, parsing,</text><text x="24" y="171" font-size="13.5" fill="#c9d1d9">semantic checks and Python code generation. Packaged</text><text x="24" y="190" font-size="13.5" fill="#c9d1d9">with Docker as a browser-based environment that</text><text x="24" y="209" font-size="13.5" fill="#c9d1d9">visualizes every compilation phase.</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><rect x="24.0" y="228" width="49.6" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="48.8" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#22d3ee">Flex</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><rect x="81.6" y="228" width="56.5" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="109.8" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#22d3ee">Bison</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><rect x="146.1" y="228" width="63.4" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="177.8" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#22d3ee">Python</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><rect x="217.5" y="228" width="146.2" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="290.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#22d3ee">Three-Address Code</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6364;1" dur="1.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6364;1" dur="1.10s" fill="freeze"/><rect x="24.0" y="258" width="63.4" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="55.7" y="274.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#22d3ee">Docker</text></g>
