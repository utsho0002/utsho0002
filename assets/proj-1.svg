<text x="26" y="152" font-size="13.5" fill="#cbd5e1">A Bengali-script language compiler with lexing, parsing,</text><text x="26" y="171" font-size="13.5" fill="#cbd5e1">semantic checks and Python code generation. Packaged</text><text x="26" y="190" font-size="13.5" fill="#cbd5e1">with Docker as a browser-based environment that</text><text x="26" y="209" font-size="13.5" fill="#cbd5e1">visualizes every compilation phase.</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><rect x="26.0" y="224" width="64.0" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="41.0" cy="238" r="4.5" fill="#94a3b8"/><text x="54.0" y="242.5" font-size="12.5" fill="#cbd5e1">Flex</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4805;1" dur="0.77s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4805;1" dur="0.77s" fill="freeze"/><rect x="98.0" y="224" width="71.5" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="113.0" cy="238" r="4.5" fill="#94a3b8"/><text x="126.0" y="242.5" font-size="12.5" fill="#cbd5e1">Bison</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5238;1" dur="0.84s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5238;1" dur="0.84s" fill="freeze"/><rect x="177.5" y="224" width="79.0" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="192.5" cy="238" r="4.5" fill="#3776AB"/><text x="205.5" y="242.5" font-size="12.5" fill="#cbd5e1">Python</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5604;1" dur="0.91s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5604;1" dur="0.91s" fill="freeze"/><rect x="26.0" y="260" width="169.0" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="41.0" cy="274" r="4.5" fill="#a78bfa"/><text x="54.0" y="278.5" font-size="12.5" fill="#cbd5e1">Three-Address Code</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5918;1" dur="0.98s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5918;1" dur="0.98s" fill="freeze"/><rect x="203.0" y="260" width="79.0" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="218.0" cy="274" r="4.5" fill="#2496ED"/><text x="231.0" y="278.5" font-size="12.5" fill="#cbd5e1">Docker</text></g>
