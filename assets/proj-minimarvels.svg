<text x="66.5" y="37" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#34d399" letter-spacing="1">MOBILE APP</text>
<text x="416" y="38" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8b949e">Feb - Jun 2026</text>
<text x="24" y="86" font-size="30" font-weight="800" fill="#e6edf3">Mini Marvels</text>
<text x="24" y="110" font-size="14" fill="#34d399">Parent-Child Learning &amp; Task Management App</text>
<rect x="24" y="126" width="392" height="1" fill="#30363d"/>
<text x="24" y="152" font-size="13.5" fill="#c9d1d9">A cross-platform app where parents assign tasks and</text><text x="24" y="171" font-size="13.5" fill="#c9d1d9">children earn XP rewards after proof verification, with</text><text x="24" y="190" font-size="13.5" fill="#c9d1d9">screen-time and bedtime controls backed by a cloud</text><text x="24" y="209" font-size="13.5" fill="#c9d1d9">database on Supabase.</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><rect x="24.0" y="228" width="70.3" height="24" rx="12.0" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="59.1" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#34d399">Flutter</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><rect x="102.3" y="228" width="49.6" height="24" rx="12.0" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="127.1" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#34d399">Dart</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><rect x="159.9" y="228" width="77.2" height="24" rx="12.0" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="198.5" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#34d399">Supabase</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><rect x="245.1" y="228" width="91.0" height="24" rx="12.0" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="290.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#34d399">PostgreSQL</text></g>
