<text x="24" y="110" font-size="14" fill="#f472b6">Blood Donation Coordination Platform</text>
<rect x="24" y="126" width="392" height="1" fill="#30363d"/>
<text x="24" y="152" font-size="13.5" fill="#c9d1d9">A responsive web app that connects blood donors with</text><text x="24" y="171" font-size="13.5" fill="#c9d1d9">patients and tracks blood requests, with secure donor</text><text x="24" y="190" font-size="13.5" fill="#c9d1d9">registration through Firebase authentication, deployed</text><text x="24" y="209" font-size="13.5" fill="#c9d1d9">online.</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><rect x="24.0" y="228" width="77.2" height="24" rx="12.0" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/><text x="62.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#f472b6">React.js</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><rect x="109.2" y="228" width="104.8" height="24" rx="12.0" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/><text x="161.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#f472b6">Tailwind CSS</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><rect x="222.0" y="228" width="77.2" height="24" rx="12.0" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/><text x="260.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#f472b6">Firebase</text></g>
