<text x="24" y="152" font-size="13.5" fill="#c9d1d9">A full-stack web app for residents to file, track and</text><text x="24" y="171" font-size="13.5" fill="#c9d1d9">manage local complaints in one place, with Firebase</text><text x="24" y="190" font-size="13.5" fill="#c9d1d9">authentication and a responsive interface, deployed</text><text x="24" y="209" font-size="13.5" fill="#c9d1d9">online.</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.4286;1" dur="0.70s" fill="freeze"/><rect x="24.0" y="228" width="77.2" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="62.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">React.js</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5000;1" dur="0.80s" fill="freeze"/><rect x="109.2" y="228" width="104.8" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="161.6" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">Tailwind CSS</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5556;1" dur="0.90s" fill="freeze"/><rect x="222.0" y="228" width="70.3" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="257.1" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">Node.js</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6000;1" dur="1.00s" fill="freeze"/><rect x="300.3" y="228" width="91.0" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="345.8" y="244.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">Express.js</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6364;1" dur="1.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6364;1" dur="1.10s" fill="freeze"/><rect x="24.0" y="258" width="70.3" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="59.1" y="274.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">MongoDB</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6667;1" dur="1.20s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.6667;1" dur="1.20s" fill="freeze"/><rect x="102.3" y="258" width="77.2" height="24" rx="12.0" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/><text x="140.9" y="274.0" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#6366f1">Firebase</text></g>
