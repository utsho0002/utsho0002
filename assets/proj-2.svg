ributeName="transform" type="translate" values="0 6;0 6;0 0" keyTimes="0;0.5604;1" dur="0.91s" fill="freeze"/><rect x="294.5" y="224" width="109.0" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".13"/><circle cx="309.5" cy="238" r="4.5" fill="#4169E1"/><text x="322.5" y="242.5" font-size="12.5" fill="#cbd5e1">PostgreSQL</text></g>
